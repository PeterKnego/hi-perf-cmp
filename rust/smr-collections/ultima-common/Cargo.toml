[package]
name = "smr-collections-ultima"
version.workspace = true
edition.workspace = true

[lib]
name = "smr_collections_ultima"
path = "src/lib.rs"

[dependencies]
bench-common = { path = "../../bench-common" }
smr-collections-common = { path = "../common" }
booksnap = { package = "booksnap-codec", path = "../booksnap-sbe/generated/booksnap" }
crc32c = { workspace = true }
ultima_db = { workspace = true }

[features]
# Forwards to ultima_db's narrow B-tree fanout (T=8), aimed at write-dominated
# SMR workloads: smaller nodes mean cheaper copy-on-write clones per touched
# node (fewer Arc bumps), at some read cost. A/B a cell with
# `cargo run --release -p <cell> --features fanout-t8`.
fanout-t8 = ["ultima_db/fanout-t8"]
