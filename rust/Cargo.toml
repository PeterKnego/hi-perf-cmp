[workspace]
resolver = "2"
members = [
    "bench-common",
    "network-rtt/tcp",
    "network-rtt/udp",
    "network-rtt/quic",
    "filesystem-write/fsync",
    "filesystem-write/fdatasync",
    "filesystem-write/prealloc",
    "filesystem-write/batch",
    "thread-handoff/spin",
    "thread-handoff/condvar",
    "thread-handoff/channel",
    "thread-handoff/ring",
    "thread-handoff/disruptor",
    "handoff-compare",
    "serialization/common",
    "serialization/bincode",
    "serialization/sbe_gen",
    "serialization/aeron_sbe",
    "serialization/aeron_sbe/generated/journal",
    "serialization/conformance",
    "smr-collections/common",
    "smr-collections/booksnap-sbe/generated/booksnap",
    "smr-collections/insert",
    "smr-collections/update",
    "smr-collections/snapshot",
    "smr-collections/mvcc_insert",
    "smr-collections/mvcc_update",
    "smr-collections/mvcc_snapshot",
    "smr-collections/live_stw",
    "smr-collections/live_mvcc",
    "smr-collections/ultima-common",
    "smr-collections/ultima_insert",
    "smr-collections/ultima_update",
    "smr-collections/ultima_snapshot",
    "smr-collections/live_ultima",
    "rpc-roundtrip/common",
    "rpc-roundtrip/sbe_udp",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
authors = ["Peter Knego"]

# Shared dependencies inherited by member crates via `dep.workspace = true`.
# Most benchmarks are std-only; the QUIC experiment crate is the only consumer
# of the quinn/rustls/rcgen/tokio stack below.
[workspace.dependencies]
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
zerocopy = { version = "0.8", features = ["derive"] }
sbe_gen = "0.7.3"
crc32c = "0.6"
ultima_db = { package = "ultima-db", git = "https://github.com/PeterKnego/ultima_db.git", rev = "b48295e9ad6ba6e54100a6e8ec9248c8e84e09c3" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
